name: skyripple_desktop
description: "SkyRipple Desktop client in Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  socket_io_client: ^3.0.2
  file_selector: ^1.1.0
  pointycastle: ^4.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_32x32_transparente.svg
    - assets/images/logo_512x512_transparente.svg
